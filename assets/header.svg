<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Vilis — AI and agent engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="55%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#101a28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7dd3fc" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <ellipse cx="960" cy="150" rx="340" ry="230" fill="url(#glow)"/>

    <!-- agent graph motif -->
    <g stroke="#60a5fa" stroke-opacity="0.30" stroke-width="1.25" fill="none">
      <path d="M905 92 L1010 142 M1010 142 L938 206 M938 206 L905 92 M1010 142 L1108 98 M938 206 L1046 232 M905 92 L1000 58"/>
    </g>
    <g fill="#0d1420" stroke="url(#accent)" stroke-width="1.75">
      <circle cx="905" cy="92" r="7"/><circle cx="1010" cy="142" r="10"/>
      <circle cx="938" cy="206" r="7"/><circle cx="1108" cy="98" r="5.5"/>
      <circle cx="1046" cy="232" r="5.5"/><circle cx="1000" cy="58" r="5.5"/>
    </g>
    <circle r="3.2" fill="#2dd4bf">
      <animateMotion dur="4.4s" repeatCount="indefinite"
        path="M905 92 L1010 142 L938 206 L905 92 L1000 58"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.6" fill="#a78bfa">
      <animateMotion dur="5.8s" begin="1.1s" repeatCount="indefinite"
        path="M1108 98 L1010 142 L1046 232 L938 206"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="142" r="10" fill="none" stroke="#2dd4bf" stroke-width="1.5">
      <animate attributeName="r" values="10;26;10" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55;0;0.55" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- type -->
    <text x="72" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" letter-spacing="5" fill="#2dd4bf" fill-opacity="0.85">$ whoami</text>
    <text x="72" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="78" font-weight="700" letter-spacing="-1" fill="url(#accent)">vilis</text>
    <rect x="322" y="150" width="15" height="56" fill="#2dd4bf" rx="2">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <text x="74" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="21" fill="#8b98a8">AI &amp; agent engineer · local-first systems that think</text>
    <rect x="72" y="256" width="620" height="2" fill="url(#rule)" rx="1"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="18" fill="none" stroke="#223040"/>
</svg>
