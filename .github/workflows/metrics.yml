name: Generate metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      # Job-level env so step `if:` can gate on it; the `secrets` context is
      # not available in a step `if:`. Without the PAT the panels stay as the
      # committed placeholders instead of failing the run.
      HAS_METRICS_TOKEN: ${{ secrets.METRICS_TOKEN != '' }}
    steps:
      - name: Overview panel
        if: env.HAS_METRICS_TOKEN == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: L33B0mb
          filename: assets/metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Africa/Johannesburg
          config_display: large
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_colors: github
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: no

      - name: Contribution calendar
        if: env.HAS_METRICS_TOKEN == 'true'
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: L33B0mb
          filename: assets/metrics-calendar.svg
          template: classic
          base: ""
          config_timezone: Africa/Johannesburg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
